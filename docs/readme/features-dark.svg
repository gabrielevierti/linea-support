<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" width="960" height="368" role="img" aria-label="Features: Near you: The stops around you and their next departures, as soon as you open the app.; Step-by-step guidance: When to leave, where to board, when to get off, on the Dynamic Island, Lock Screen and Watch.; Trains too: The Passante, S lines, Malpensa Express and regional trains, in routes and stops.; BikeMi, live: Regular bikes, e-bikes and free docks; routes also offer a bike option.; Strike days: Guaranteed hours, guaranteed rides first and a reminder the evening before.; Works underground: Timetables live on the phone, so stops, departures and routes work with no signal."><title>Features: Near you: The stops around you and their next departures, as soon as you open the app.; Step-by-step guidance: When to leave, where to board, when to get off, on the Dynamic Island, Lock Screen and Watch.; Trains too: The Passante, S lines, Malpensa Express and regional trains, in routes and stops.; BikeMi, live: Regular bikes, e-bikes and free docks; routes also offer a bike option.; Strike days: Guaranteed hours, guaranteed rides first and a reminder the evening before.; Works underground: Timetables live on the phone, so stops, departures and routes work with no signal.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#58a6ff;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
